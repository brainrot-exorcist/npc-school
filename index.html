<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблицы Шульте</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #eee;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px; gap: 16px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #e94560; }
  .pickers { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .picker-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .picker-label { color: #888; font-size: 0.85rem; margin-right: 4px; }
  .size-btn, .mode-btn {
    font-family: inherit; font-size: 0.95rem; padding: 8px 18px;
    border: 2px solid #0f3460; border-radius: 10px;
    background: transparent; color: #ccc; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .size-btn:hover, .mode-btn:hover { border-color: #1a4a7a; color: #fff; }
  .size-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
  .mode-btn.active { background: #7b2cbf; border-color: #7b2cbf; color: #fff; }
  .stats {
    display: flex; gap: 24px; font-size: 1.1rem;
    background: #16213e; padding: 12px 28px; border-radius: 12px;
    flex-wrap: wrap; justify-content: center;
  }
  .stats b { color: #4cc9f0; }
  /* Контейнер поля — квадрат, внутри абсолютное позиционирование */
  #board {
    position: relative;
    width: min(92vw, 480px);
    aspect-ratio: 1;
    background: #16213e;
    border-radius: 16px;
    overflow: hidden;
  }
  .cell {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    background: #0f3460;
    border: 2px solid #16213e;   /* визуальный зазор между клетками */
    border-radius: 0;
    color: #e0e0e0; cursor: pointer;
    transition: background 0.15s;
    user-select: none; -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .cell.done { background: #1b3a1b; color: #4caf50 !important; cursor: default; }
  .cell.wrong { background: #5a1a1a; }
  button.action {
    font-family: inherit; font-size: 1rem; padding: 12px 28px;
    border: none; border-radius: 10px; background: #e94560; color: #fff;
    font-weight: 600; cursor: pointer;
  }
  .history {
    width: min(92vw, 480px); background: #16213e;
    border-radius: 12px; padding: 14px 18px;
  }
  .history h2 { font-size: 1rem; color: #4cc9f0; margin-bottom: 8px; }
  .record {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid #0f3460;
    gap: 10px;
  }
  .record:last-child { border-bottom: none; }
  .record .label { color: #aaa; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .record .tag {
    font-size: 0.7rem; padding: 2px 6px; border-radius: 6px;
    background: #0f3460; color: #aaa;
  }
  .record .tag.expert { background: #3a1a5a; color: #c49eff; }
  .record .time { color: #4cc9f0; font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .empty { color: #666; font-style: italic; font-size: 0.9rem; }
  #message { color: #4cc9f0; font-weight: 600; min-height: 1.4em; text-align: center; }
  .hint { color: #666; font-size: 0.8rem; text-align: center; max-width: 92vw; }
</style>
</head>
<body>
  <h1>Таблицы Шульте</h1>

  <div class="pickers">
    <div class="picker-group" id="sizePicker">
      <span class="picker-label">Размер:</span>
      <button class="size-btn" data-size="3">3×3</button>
      <button class="size-btn" data-size="4">4×4</button>
      <button class="size-btn active" data-size="5">5×5</button>
      <button class="size-btn" data-size="6">6×6</button>
    </div>
    <div class="picker-group" id="modePicker">
      <span class="picker-label">Режим:</span>
      <button class="mode-btn active" data-mode="normal">Обычный</button>
      <button class="mode-btn" data-mode="expert">Эксперт</button>
    </div>
  </div>

  <div class="stats">
    <div>Размер: <b id="sizeLabel">5×5</b></div>
    <div>Режим: <b id="modeLabel">Обычный</b></div>
    <div>Время: <b id="timer">00.00</b></div>
    <div>Далее: <b id="next">1</b></div>
  </div>

  <div id="message"></div>
  <div id="board"></div>
  <button class="action" id="newBtn">Новая таблица</button>

  <div class="history">
    <h2>История результатов</h2>
    <div id="historyList"><div class="empty">Пока нет результатов — пройдите таблицу.</div></div>
  </div>

  <p class="hint">Обычный режим — ровная сетка. Эксперт — клетки разного размера и формы (в т.ч. прямоугольные), поле всегда заполнено полностью.</p>

<script>
var currentSize = 5;
var currentMode = 'normal';
var next = 1;
var startTime = null;
var timerId = null;
var solved = false;
var attempt = 0;

var boardEl = document.getElementById('board');
var timerEl = document.getElementById('timer');
var nextEl = document.getElementById('next');
var sizeLabelEl = document.getElementById('sizeLabel');
var modeLabelEl = document.getElementById('modeLabel');
var messageEl = document.getElementById('message');
var historyListEl = document.getElementById('historyList');
var sizePicker = document.getElementById('sizePicker');
var modePicker = document.getElementById('modePicker');
var newBtn = document.getElementById('newBtn');

function formatTime(ms) {
  var s = (ms / 1000).toFixed(2);
  while (s.length < 5) s = '0' + s;
  return s;
}

function setupSizeButtons() {
  var btns = sizePicker.getElementsByTagName('button');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    if (!b.getAttribute('data-size')) continue;
    b.className = (parseInt(b.getAttribute('data-size'), 10) === currentSize) ? 'size-btn active' : 'size-btn';
    b.onclick = function() {
      currentSize = parseInt(this.getAttribute('data-size'), 10);
      setupSizeButtons();
      sizeLabelEl.textContent = currentSize + '×' + currentSize;
      resetGame();
    };
  }
}

function setupModeButtons() {
  var btns = modePicker.getElementsByTagName('button');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    var m = b.getAttribute('data-mode');
    if (!m) continue;
    b.className = (m === currentMode) ? 'mode-btn active' : 'mode-btn';
    b.onclick = function() {
      currentMode = this.getAttribute('data-mode');
      setupModeButtons();
      modeLabelEl.textContent = currentMode === 'expert' ? 'Эксперт' : 'Обычный';
      resetGame();
    };
  }
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/*
  РЕКУРСИВНОЕ РАЗБИЕНИЕ КВАДРАТА.
  Каждый прямоугольник: { x, y, w, h } в долях [0..1].
  Начинаем с одного { 0, 0, 1, 1 }.
  Пока прямоугольников < total:
    - выбираем случайный прямоугольник;
    - режем его на две части: вертикально или горизонтально,
      в случайной пропорции (0.25…0.75), чтобы куски были разными.
  В результате получаем total прямоугольников, идеально заполняющих квадрат.
*/
function splitSquare(total) {
  var rects = [{ x: 0, y: 0, w: 1, h: 1 }];

  while (rects.length < total) {
    // Выбираем прямоугольник для разреза — предпочитаем крупные
    // (случайный с весами по площади — так куски будут более равномерными)
    var totalArea = 0;
    for (var i = 0; i < rects.length; i++) totalArea += rects[i].w * rects[i].h;
    var pick = Math.random() * totalArea;
    var acc = 0;
    var idx = 0;
    for (var i = 0; i < rects.length; i++) {
      acc += rects[i].w * rects[i].h;
      if (pick <= acc) { idx = i; break; }
    }

    var r = rects[idx];
    // Выбор направления: если сильно вытянут — режем вдоль длинной стороны
    var vertical;
    if (r.w > r.h * 1.6) vertical = true;
    else if (r.h > r.w * 1.6) vertical = false;
    else vertical = Math.random() < 0.5;

    // Пропорция разреза 0.25…0.75 (не слишком тонкие полоски)
    var ratio = 0.3 + Math.random() * 0.4;

    var a, b;
    if (vertical) {
      a = { x: r.x, y: r.y, w: r.w * ratio, h: r.h };
      b = { x: r.x + r.w * ratio, y: r.y, w: r.w * (1 - ratio), h: r.h };
    } else {
      a = { x: r.x, y: r.y, w: r.w, h: r.h * ratio };
      b = { x: r.x, y: r.y + r.h * ratio, w: r.w, h: r.h * (1 - ratio) };
    }

    rects.splice(idx, 1, a, b);
  }

  return rects;
}

function buildExpertGrid(total, nums) {
  boardEl.innerHTML = '';

  var rects = splitSquare(total);
  // Сопоставляем прямоугольники с числами
  for (var i = 0; i < rects.length; i++) {
    var r = rects[i];
    var n = nums[i];
    var btn = document.createElement('button');
    btn.className = 'cell';
    btn.textContent = n;
    btn.setAttribute('data-num', n);
    btn.onclick = onCellClick;

    // Позиция в процентах
    btn.style.left = (r.x * 100) + '%';
    btn.style.top = (r.y * 100) + '%';
    btn.style.width = (r.w * 100) + '%';
    btn.style.height = (r.h * 100) + '%';

    // Шрифт зависит от размера клетки: оцениваем через площадь
    var area = r.w * r.h;
    var avgArea = 1 / total;
    var scale = Math.sqrt(area / avgArea);  // 1.0 = средняя клетка
    var base = currentSize === 3 ? 2.2
             : currentSize === 4 ? 1.8
             : currentSize === 5 ? 1.5
             : 1.2;
    // Ограничиваем масштаб, чтобы шрифт не был слишком мелким/крупным
    var fs = base * Math.min(1.6, Math.max(0.7, scale));
    btn.style.fontSize = fs.toFixed(2) + 'rem';

    boardEl.appendChild(btn);
  }
}

function buildNormalGrid(total, nums) {
  boardEl.innerHTML = '';
  var N = currentSize;
  var cellPct = 100 / N;
  var base = currentSize === 3 ? 2.4
            : currentSize === 4 ? 2.0
            : currentSize === 5 ? 1.6
            : 1.3;
  for (var row = 0; row < N; row++) {
    for (var col = 0; col < N; col++) {
      var idx = row * N + col;
      var n = nums[idx];
      var btn = document.createElement('button');
      btn.className = 'cell';
      btn.textContent = n;
      btn.setAttribute('data-num', n);
      btn.onclick = onCellClick;
      btn.style.left = (col * cellPct) + '%';
      btn.style.top = (row * cellPct) + '%';
      btn.style.width = cellPct + '%';
      btn.style.height = cellPct + '%';
      btn.style.fontSize = base + 'rem';
      boardEl.appendChild(btn);
    }
  }
}

function buildGrid() {
  var total = currentSize * currentSize;
  var nums = [];
  for (var i = 1; i <= total; i++) nums.push(i);
  shuffle(nums);

  if (currentMode === 'expert') {
    buildExpertGrid(total, nums);
  } else {
    buildNormalGrid(total, nums);
  }
}

function resetGame() {
  if (timerId) clearInterval(timerId);
  next = 1;
  startTime = null;
  solved = false;
  timerEl.textContent = '00.00';
  nextEl.textContent = '1';
  messageEl.textContent = '';
  buildGrid();
}

function onCellClick() {
  if (solved) return;
  var num = parseInt(this.getAttribute('data-num'), 10);
  var total = currentSize * currentSize;

  if (num !== next) {
    var el = this;
    el.classList.add('wrong');
    setTimeout(function() { el.classList.remove('wrong'); }, 300);
    return;
  }

  if (next === 1) {
    startTime = Date.now();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(function() {
      if (!solved) timerEl.textContent = formatTime(Date.now() - startTime);
    }, 50);
  }

  this.classList.add('done');
  next++;
  nextEl.textContent = next > total ? '✓' : next;

  if (next === total + 1) {
    solved = true;
    clearInterval(timerId);
    var elapsed = Date.now() - startTime;
    timerEl.textContent = formatTime(elapsed);
    messageEl.textContent = 'Готово! ' + formatTime(elapsed) + ' с (' + currentSize + '×' + currentSize + ', ' +
      (currentMode === 'expert' ? 'эксперт' : 'обычный') + ')';
    addRecord(elapsed);

    if (currentMode === 'expert') {
      setTimeout(function() {
        resetGame();
        messageEl.textContent = 'Новая таблица (эксперт) готова — поехали!';
      }, 1200);
    }
  }
}

function addRecord(ms) {
  attempt++;
  var emptyEl = historyListEl.querySelector('.empty');
  if (emptyEl) historyListEl.removeChild(emptyEl);

  var rec = document.createElement('div');
  rec.className = 'record';

  var label = document.createElement('span');
  label.className = 'label';
  label.textContent = 'Попытка ' + attempt;

  var tagSize = document.createElement('span');
  tagSize.className = 'tag';
  tagSize.textContent = currentSize + '×' + currentSize;

  var tagMode = document.createElement('span');
  tagMode.className = 'tag' + (currentMode === 'expert' ? ' expert' : '');
  tagMode.textContent = currentMode === 'expert' ? 'эксперт' : 'обычный';

  label.appendChild(tagSize);
  label.appendChild(tagMode);

  var time = document.createElement('span');
  time.className = 'time';
  time.textContent = formatTime(ms) + ' с';

  rec.appendChild(label);
  rec.appendChild(time);

  if (historyListEl.firstChild) {
    historyListEl.insertBefore(rec, historyListEl.firstChild);
  } else {
    historyListEl.appendChild(rec);
  }
}

newBtn.onclick = resetGame;

sizeLabelEl.textContent = currentSize + '×' + currentSize;
modeLabelEl.textContent = 'Обычный';
setupSizeButtons();
setupModeButtons();
resetGame();
</script>
</body>
</html>
