<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Упражнения</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', Arial, sans-serif;
    background: #f6f6f6;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; margin: 0; padding: 15px; color: #141414;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 25px 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid #e8e8e8; text-align: center;
    max-width: 600px; width: 100%;
  }
  h1 { margin: 0 0 18px; font-size: 24px; font-weight: bold; }

  .list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 16px;
    background: #f0f0f0; border-radius: 0;
    text-decoration: none; color: #141414;
    font-size: 15px; font-weight: bold;
    transition: background 0.15s, transform 0.1s;
    border: none; cursor: pointer; font-family: inherit;
    text-align: left;
  }
  .item:hover { background: #e6e6e6; }
  .item:active { transform: translateY(1px); }
  .item .arrow {
    flex: 0 0 auto;
    width: 22px; height: 22px; border-radius: 50%;
    background: #FFD502; color: #141414;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; box-shadow: 0 2px 0 #c9a800;
  }

  .status {
    font-size: 14px; color: #757575;
    display: flex; align-items: center; justify-content: center;
    gap: 8px; min-height: 24px; margin-top: 8px;
  }
  .status .ico {
    width: 18px; height: 18px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; background: #4caf50; color: #fff;
  }
  .status .ico.error { background: #e07a7a; }

  .empty {
    padding: 20px; color: #757575; font-size: 14px;
    background: #fbfbfb; border-radius: 8px;
    border: 1px dashed #dcdcdc;
  }

  @media (max-width: 420px) {
    h1 { font-size: 20px; }
    .item { font-size: 14px; padding: 12px 14px; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>Упражнения</h1>
  <div class="list" id="list"></div>
  <div class="status" id="status"></div>
</div>

<script>
  /* ============================================================
     СПИСОК УПРАЖНЕНИЙ
     ------------------------------------------------------------
     Чтобы добавить упражнение, допишите строчку вида:
         { file: "имя-файла.html" },
     перед закрывающей скобкой ];
     Название писать не нужно — оно берётся из <h1> упражнения.
     ============================================================ */
  const EXERCISES = [
    { file: "умн деление его новый.html" },
  ];

  (async function () {
    'use strict';

    var listEl = document.getElementById('list');
    var statusEl = document.getElementById('status');

    function setStatus(text, isError) {
      statusEl.innerHTML = '';
      var ico = document.createElement('span');
      ico.className = 'ico' + (isError ? ' error' : '');
      ico.textContent = isError ? '×' : '✓';
      var span = document.createElement('span');
      span.textContent = text;
      statusEl.appendChild(ico);
      statusEl.appendChild(span);
    }

    async function getName(file) {
      try {
        var res = await fetch(encodeURI(file));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var html = await res.text();
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var h1 = doc.querySelector('h1');
        if (h1 && h1.textContent.trim()) return h1.textContent.trim();
        var t = doc.querySelector('title');
        if (t && t.textContent.trim()) return t.textContent.trim();
      } catch (e) { /* fallthrough */ }
      return file.replace(/\.html?$/i, '');
    }

    if (!EXERCISES.length) {
      setStatus('Список упражнений пуст', false);
      listEl.innerHTML = '<div class="empty">Пока нет упражнений.</div>';
      return;
    }

    var entries = await Promise.all(EXERCISES.map(async function (ex) {
      return { file: ex.file, name: await getName(ex.file) };
    }));

    entries.forEach(function (e) {
      var a = document.createElement('a');
      a.className = 'item';
      a.href = encodeURI(e.file);
      var nameSpan = document.createElement('span');
      nameSpan.textContent = e.name;
      var arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      a.appendChild(nameSpan);
      a.appendChild(arrow);
      listEl.appendChild(a);
    });

    setStatus('Упражнений: ' + entries.length, false);
  })();
</script>
</body>
</html>
