<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мемори</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 16px;
  }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #94a3b8; font-size: 14px; margin-bottom: 12px; text-align: center; }

  .sizes {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin-bottom: 14px;
  }
  .size-btn {
    padding: 8px 14px; border: 1px solid #334155; border-radius: 999px;
    background: #1e293b; color: #e2e8f0; font-size: 14px; cursor: pointer;
  }
  .size-btn.active {
    background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 700;
  }

  .bar {
    display: flex; gap: 16px; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; justify-content: center;
  }
  .stat { font-size: 14px; color: #94a3b8; }
  .stat b { color: #e2e8f0; font-size: 17px; }

  button.restart {
    padding: 10px 20px; border: none; border-radius: 10px;
    background: #38bdf8; color: #0f172a; font-weight: 700;
    font-size: 15px; cursor: pointer;
  }
  button.restart:active { transform: scale(0.97); }

  .grid {
    display: grid; gap: 6px;
    width: 100%; max-width: 520px;
  }
  .card {
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
    background: #334155; border-radius: 10px;
    font-size: clamp(18px, 5vw, 32px); cursor: pointer; user-select: none;
    transition: background 0.15s;
  }
  .card:hover { background: #475569; }
  .card.open { background: #38bdf8; }
  .card.done { background: #22c55e; cursor: default; }
  .card.done:hover { background: #22c55e; }

  .msg {
    margin-top: 14px; min-height: 24px; font-weight: 700;
    text-align: center; font-size: 16px;
  }
  .msg.ok { color: #22c55e; }
</style>
</head>
<body>
  <h1>Мемори</h1>
  <div class="sub">Выбери поле и найди все пары</div>

  <div class="sizes" id="sizes"></div>

  <div class="bar">
    <div class="stat">Ходы: <b id="moves">0</b></div>
    <div class="stat">Пары: <b id="pairs">0</b></div>
    <button class="restart" id="start">Новая игра</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>

<script>
  // все размеры: строки × столбцы. Всего карточек должно быть чётным.
  const SIZES = [
    { rows: 3, cols: 4 },  // 12 карточек → 6 пар
    { rows: 4, cols: 4 },  // 16 → 8 пар
    { rows: 4, cols: 5 },  // 20 → 10 пар
    { rows: 5, cols: 6 },  // 30 → 15 пар
    { rows: 6, cols: 6 },  // 36 → 18 пар
  ];

  const POOL = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮',
                '🐷','🐸','🐵','🐔','🦄','🐙','🦋','🐢','🐬','🦉'];

  const sizesEl = document.getElementById('sizes');
  const gridEl  = document.getElementById('grid');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const msgEl   = document.getElementById('msg');
  const startBtn = document.getElementById('start');

  let currentSize = SIZES[1]; // по умолчанию 4×4
  let firstCard = null;
  let lock = false;
  let moves = 0;
  let pairsFound = 0;
  let totalPairs = 0;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // кнопки выбора размера
  SIZES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'size-btn' + (s === currentSize ? ' active' : '');
    btn.textContent = s.rows + '×' + s.cols;
    btn.addEventListener('click', () => {
      currentSize = s;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      newGame();
    });
    sizesEl.appendChild(btn);
  });

  function newGame() {
    firstCard = null;
    lock = false;
    moves = 0;
    pairsFound = 0;
    msgEl.textContent = '';
    msgEl.className = 'msg';

    const totalCards = currentSize.rows * currentSize.cols;
    totalPairs = totalCards / 2;

    movesEl.textContent = '0';
    pairsEl.textContent = '0/' + totalPairs;

    // берём нужное число разных эмодзи и дублируем
    const chosen = shuffle([...POOL]).slice(0, totalPairs);
    const deck = shuffle([...chosen, ...chosen]);

    gridEl.style.gridTemplateColumns = 'repeat(' + currentSize.cols + ', 1fr)';
    gridEl.innerHTML = '';

    deck.forEach(emoji => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.dataset.open = '0';
      card.addEventListener('click', () => onCardClick(card));
      gridEl.appendChild(card);
    });
  }

  function onCardClick(card) {
    if (lock) return;
    if (card.dataset.open === '1') return;
    if (card.classList.contains('done')) return;

    card.textContent = card.dataset.emoji;
    card.classList.add('open');
    card.dataset.open = '1';

    if (!firstCard) {
      firstCard = card;
      return;
    }

    moves++;
    movesEl.textContent = moves;

    if (firstCard.dataset.emoji === card.dataset.emoji) {
      firstCard.classList.add('done');
      card.classList.add('done');
      firstCard.classList.remove('open');
      card.classList.remove('open');
      firstCard = null;
      pairsFound++;
      pairsEl.textContent = pairsFound + '/' + totalPairs;

      if (pairsFound === totalPairs) {
        msgEl.textContent = 'Победа за ' + moves + ' ходов! 🏆';
        msgEl.className = 'msg ok';
      }
    } else {
      lock = true;
      const a = firstCard;
      const b = card;
      setTimeout(() => {
        a.textContent = '';
        a.classList.remove('open');
        a.dataset.open = '0';
        b.textContent = '';
        b.classList.remove('open');
        b.dataset.open = '0';
        firstCard = null;
        lock = false;
      }, 700);
    }
  }

  startBtn.addEventListener('click', newGame);
  newGame();
</script>
</body>
</html>
